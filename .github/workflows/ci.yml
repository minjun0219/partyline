name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Context7 reads this file to hand coding agents the Partyline docs. Past a
      # limit (description 200 chars, rules 255 each) it is rejected or cut, so
      # validate against the schema Context7 publishes, fetched fresh each run.
      - name: context7.json schema
        run: |
          curl -sSfL --retry 3 https://context7.com/schema/context7.json -o "$RUNNER_TEMP/context7.schema.json"
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate -c ajv-formats \
            -s "$RUNNER_TEMP/context7.schema.json" -d context7.json
      - run: pnpm check
      - run: pnpm -r typecheck
      # Includes the plugin's e2e test, which spawns the reference relay under
      # wrangler and runs the whole protocol story against it.
      - run: pnpm -r test
      - name: bundled MCP server is current
        run: |
          pnpm --dir plugin/mcp build
          git diff --exit-code plugin/mcp/dist
